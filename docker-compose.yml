services:
  postgres:
    image: postgres:15-alpine
    container_name: demand_x_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: demand_x
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demand_x"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: demand_x_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/demand_x
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
